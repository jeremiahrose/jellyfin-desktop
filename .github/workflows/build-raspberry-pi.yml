name: build-raspberry-pi

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-raspios-bookworm:
    runs-on: "ubuntu-24.04-arm"
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Docker Build
      run: |
        docker build -f deployment/Dockerfile.raspios -t builddeb-raspios deployment
        docker run -v $(pwd)/deployment/dist:/dist -v $(pwd):/jellyfin builddeb-raspios
        sudo chown --recursive $USER $(pwd)/deployment/dist
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: raspios-bookworm-arm64
        path: ${{ github.workspace }}/deployment/dist/*
